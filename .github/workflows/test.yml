name: PayGuard tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run automated tests
        run: npm test
      - name: Validate distribution module syntax
        run: node --check dist/plugin.mjs
      - name: Verify distribution imports
        run: node --input-type=module -e "import('./dist/plugin.mjs').then(({default: p}) => { if (p.tools.length !== 3) process.exit(1); console.log('PayGuard tool exports:', p.tools.map(t => t.name).join(', ')); })"
